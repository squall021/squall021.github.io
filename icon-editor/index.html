<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>圖示編輯器 V1.2</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f5f6f8}
iframe{display:block;width:100%;height:100%;border:0}
</style>
</head>
<body>
<iframe id="appFrame" src="base-v1.1.html" title="圖示編輯器"></iframe>
<script>
const frame=document.getElementById('appFrame');
frame.addEventListener('load',()=>{
  const doc=frame.contentDocument;
  if(!doc) return;
  const s=doc.createElement('script');
  s.src='brands.js?v=1.2';
  doc.body.appendChild(s);
});
</script>
</body>
</html>
