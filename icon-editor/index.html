<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>圖示編輯器 V1.3</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f5f6f8}
iframe{display:block;width:100%;height:100%;border:0}
</style>
</head>
<body>
<iframe id="appFrame" src="base-v1.1.html" title="圖示編輯器"></iframe>
<script>
const frame=document.getElementById('appFrame');
frame.addEventListener('load',()=>{
  const doc=frame.contentDocument;
  if(!doc) return;

  const brands=doc.createElement('script');
  brands.src='brands.js?v=1.3';
  brands.onload=()=>{
    const picker=doc.createElement('script');
    picker.src='color-picker.js?v=1.3';
    doc.body.appendChild(picker);
  };
  doc.body.appendChild(brands);
});
</script>
</body>
</html>
