<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f4f7fb" />
  <title>我的工具箱</title>
  <style>
    :root{
      --bg:#f3f6fb;--panel:rgba(255,255,255,.88);--text:#192235;--muted:#6e788a;
      --line:rgba(82,101,137,.14);--shadow:0 18px 55px rgba(37,52,81,.11);
      --shadow-hover:0 26px 70px rgba(37,52,81,.18);--radius:26px
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:"Microsoft JhengHei","Noto Sans TC",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text)}
    body{min-height:100vh;background:radial-gradient(circle at 9% 3%,rgba(74,137,255,.18),transparent 29%),radial-gradient(circle at 92% 9%,rgba(151,97,255,.13),transparent 25%),linear-gradient(145deg,#f7f9fd,var(--bg))}
    a{color:inherit;text-decoration:none}
    .shell{width:min(1180px,calc(100% - 40px));margin:auto;padding:56px 0 70px}
    .hero{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:30px}
    .eyebrow{display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.72);font-size:13px;font-weight:800;color:#58647b;box-shadow:0 6px 20px rgba(45,61,95,.06)}
    h1{margin:15px 0 10px;font-size:clamp(36px,5vw,58px);line-height:1.08;letter-spacing:-1.5px}
    .hero p{max-width:690px;margin:0;color:var(--muted);font-size:16px;line-height:1.8}
    .count{flex:0 0 auto;padding:15px 19px;border:1px solid var(--line);border-radius:22px;background:rgba(255,255,255,.74);box-shadow:0 8px 25px rgba(35,52,86,.07);text-align:center}
    .count strong{display:block;font-size:26px;line-height:1}.count span{display:block;margin-top:6px;color:var(--muted);font-size:12px;font-weight:700}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}
    .card{position:relative;min-height:330px;padding:26px;overflow:hidden;border:1px solid rgba(255,255,255,.9);border-radius:var(--radius);background:var(--panel);box-shadow:var(--shadow);backdrop-filter:blur(12px);transition:.22s ease}
    .card:hover{transform:translateY(-6px);box-shadow:var(--shadow-hover);border-color:rgba(95,118,160,.24)}
    .card:focus-visible{outline:4px solid rgba(61,118,255,.25);outline-offset:4px}
    .card::after{content:"";position:absolute;width:220px;height:220px;right:-80px;top:-95px;border-radius:50%;background:var(--glow);opacity:.75}
    .art{height:156px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.8);border-radius:20px;background:var(--art-bg)}
    .art svg{width:88%;height:88%;position:relative;z-index:1}
    .card-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:20px}
    .card h2{margin:0;font-size:22px;letter-spacing:-.4px}
    .arrow{width:38px;height:38px;display:grid;place-items:center;border-radius:12px;background:#fff;box-shadow:0 6px 18px rgba(35,52,86,.1);font-size:19px;transition:transform .2s ease}
    .card:hover .arrow{transform:translateX(3px)}
    .card p{margin:9px 0 0;color:var(--muted);font-size:14px;line-height:1.7}
    .tag{display:inline-block;margin-top:13px;padding:6px 9px;border:1px solid var(--line);border-radius:9px;background:rgba(255,255,255,.72);color:#667188;font-size:11px;font-weight:800}
    .table{--glow:rgba(74,142,255,.23);--art-bg:linear-gradient(135deg,#e8f2ff,#f8fbff)}
    .edit{--glow:rgba(127,92,255,.21);--art-bg:linear-gradient(135deg,#efeaff,#faf8ff)}
    .collage{--glow:rgba(255,158,79,.22);--art-bg:linear-gradient(135deg,#fff0e3,#fffaf5)}
    footer{margin-top:30px;text-align:center;color:#8a93a5;font-size:12px}
    @media(max-width:760px){.shell{width:min(100% - 24px,1180px);padding:34px 0 45px}.hero{align-items:flex-start}.count{display:none}.grid{grid-template-columns:1fr}.card{min-height:310px;padding:20px}.art{height:145px}}
    @media(prefers-reduced-motion:reduce){.card,.arrow{transition:none}.card:hover{transform:none}}
  </style>
</head>
<body>
<main class="shell">
  <header class="hero">
    <div>
      <div class="eyebrow">▦ GitHub Pages Launcher</div>
      <h1>我的工具箱</h1>
      <p>常用網頁工具集中在這裡。點選下方卡片即可直接開啟，不需要再記住每一個 GitHub Pages 網址。</p>
    </div>
    <div class="count"><strong>3</strong><span>目前工具</span></div>
  </header>

  <section class="grid" aria-label="工具清單">
    <a class="card table" href="https://squall021.github.io/table-cards/" aria-label="開啟桌卡製作工具">
      <div class="art">
        <svg viewBox="0 0 520 210" aria-hidden="true">
          <rect x="55" y="35" width="410" height="140" rx="22" fill="#fff" stroke="#9bc7ff" stroke-width="3"/>
          <path d="M260 35v140" stroke="#c6ddf8" stroke-width="3" stroke-dasharray="8 7"/>
          <path d="M95 142h330" stroke="#d9e8f8" stroke-width="5" stroke-linecap="round"/>
          <rect x="105" y="61" width="112" height="18" rx="9" fill="#5f9eff" opacity=".22"/>
          <rect x="300" y="61" width="112" height="18" rx="9" fill="#5f9eff" opacity=".22"/>
          <text x="161" y="114" text-anchor="middle" font-size="25" font-weight="700" fill="#2864ad">桌卡</text>
          <g transform="translate(380 115) rotate(180)"><text x="0" y="0" text-anchor="middle" font-size="19" font-weight="700" fill="#5d79a0">姓名</text></g>
        </svg>
      </div>
      <div class="card-head"><h2>桌卡製作工具</h2><span class="arrow">→</span></div>
      <p>製作活動桌卡、姓名牌，支援文字、底圖、Logo、批次名單與匯出。</p>
      <span class="tag">table-cards</span>
    </a>

    <a class="card edit" href="https://squall021.github.io/photo-edit/" aria-label="開啟照片編輯器">
      <div class="art">
        <svg viewBox="0 0 520 210" aria-hidden="true">
          <rect x="80" y="30" width="250" height="150" rx="20" fill="#fff" stroke="#c7b9ff" stroke-width="3"/>
          <circle cx="154" cy="84" r="28" fill="#dacfff"/>
          <path d="M104 154l67-58 43 36 37-28 54 50z" fill="#8b72e8" opacity=".54"/>
          <g transform="translate(354 47)"><rect width="104" height="116" rx="18" fill="#fff" stroke="#d6ccff" stroke-width="3"/><path d="M25 31h55M25 58h55M25 85h55" stroke="#9b85ec" stroke-width="5" stroke-linecap="round"/><circle cx="59" cy="31" r="9" fill="#654bd1"/><circle cx="42" cy="58" r="9" fill="#654bd1"/><circle cx="68" cy="85" r="9" fill="#654bd1"/></g>
        </svg>
      </div>
      <div class="card-head"><h2>照片編輯器</h2><span class="arrow">→</span></div>
      <p>照片裁切、轉正、亮度調整、去背與批次處理等常用照片工作流程。</p>
      <span class="tag">photo-edit</span>
    </a>

    <a class="card collage" href="https://squall021.github.io/photo-collage/" aria-label="開啟照片排版工具">
      <div class="art">
        <svg viewBox="0 0 520 210" aria-hidden="true">
          <rect x="126" y="24" width="268" height="164" rx="18" fill="#fff" stroke="#ffc99e" stroke-width="3"/>
          <rect x="146" y="45" width="106" height="55" rx="9" fill="#ffd9bb"/><rect x="266" y="45" width="108" height="55" rx="9" fill="#ffe7d4"/><rect x="146" y="113" width="70" height="54" rx="9" fill="#ffe6d1"/><rect x="229" y="113" width="145" height="54" rx="9" fill="#ffd3b0"/>
          <circle cx="176" cy="68" r="10" fill="#f69d59" opacity=".8"/><path d="M154 92l30-25 17 14 18-13 26 24z" fill="#e9873c" opacity=".5"/><path d="M276 92l30-28 24 18 15-12 22 22z" fill="#eea167" opacity=".55"/><path d="M238 159l34-31 27 23 23-18 42 26z" fill="#e78e4a" opacity=".50"/>
        </svg>
      </div>
      <div class="card-head"><h2>照片排版工具</h2><span class="arrow">→</span></div>
      <p>將多張照片快速編排成頁面，設定版面、背景、封面與照片顯示方式。</p>
      <span class="tag">photo-collage</span>
    </a>
  </section>

  <footer>Tools Home · GitHub Pages</footer>
</main>
</body>
</html>
