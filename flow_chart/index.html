</style></head><body><header><div class="brand"><div class="logo">⌘</div><div><strong>流程圖編輯器</strong><small>架構圖與流程規劃</small></div></div><div class="top"><span class="saved" id="saved">● 已自動儲存</span><button class="btn optional" id="importBtn">匯入檔案</button><button class="btn optional" id="exportJson">儲存檔案</button><button class="btn primary" id="exportPng">↓ 匯出 PNG</button><input id="file" type="file" accept=".json,application/json" hidden></div></header><div class="layout"><aside class="left"><p class="section-title">畫布工具</p><button class="btn" id="addFloor" style="width:100%;margin-bottom:8px">▣ 新增樓層區塊</button><button class="btn" id="addText" style="width:100%;margin-bottom:24px">T 新增文字方塊</button><p class="section-title">線條工具</p><div class="sub">先選線條，再從設備連接點拖曳至另一個設備</div><div class="line-styles" id="linePalette" style="margin:12px 0 24px"></div><p class="section-title">設備圖示</p><div class="sub">點選或拖曳設備至畫布</div><div class="palette" id="palette"></div><p class="section-title">使用小提示</p><div class="tip">先選線條種類，再從設備的連接點拖曳到另一個設備。也可以依序點選兩個連接點。</div></aside><main class="main"><div class="bar"><div><h1>我的架構圖</h1><small>設計並記錄你的架構</small></div><div class="tools"><button class="tool active" id="select" title="選取與移動">↖ 選取</button><button class="tool" id="connect" title="連線工具">⌁ 連線</button><button class="tool" id="undo" title="復原">↶</button><button class="tool" id="redo" title="重做">↷</button><button class="tool" id="clear" title="清空畫布">清空</button><button class="tool property-toggle" id="toggleProps">屬性</button></div></div><div class="canvas-wrap" id="wrap"><svg id="canvas" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#597cae"/></marker></defs><g id="view"><g id="floors"></g><g id="edges"></g><g id="nodes"></g><g id="texts"></g><g id="arrowheads" pointer-events="none"></g><g id="handles"></g><g id="guides" pointer-events="none"></g></g></svg><div class="bottom"><button id="minus">−</button><button id="zoom">100%</button><button id="plus">＋</button><button id="fit" title="重設視圖">⌂</button></div><div class="help" id="hint">拖曳設備移動 · 點選設備編輯資訊</div></div></main><aside class="right"><div class="heading"><h2>屬性設定</h2><span class="badge">PROPERTIES</span></div><div id="properties"></div><div class="divider"></div><p class="section-title">快捷操作</p><div class="shortcuts">復原 <b>Ctrl + Z</b><br>重做 <b>Ctrl + Shift + Z</b><br>刪除選取項目 <b>Delete</b><br>全選 <b>Ctrl + A</b><br>多選 <b>Ctrl + 點選</b></div></aside></div><script>
const icons={internet:['網際網路','☁'],router:['路由器','⌁'],switch:['交換器','▤'],wifi:['Wi-Fi','◉'],firewall:['防火牆','▥'],server:['伺服器','▣'],pc:['電腦','▰'],laptop:['筆記型電腦','▱'],nas:['NAS','▧'],printer:['印表機','▦'],phone:['手機','▯'],camera:['監視器','◈'],cloud:['雲端服務','☁'],ap:['無線基地台','◎']};const ns='http://www.w3.org/2000/svg', $=id=>document.getElementById(id);let state,selected=null,mode='select',start=null,drag=null,scale=1,pan={x:0,y:0},history=[],future=[];const demo={nodes:[{id:'a',type:'internet',name:'Internet',x:410,y:55,ip:'',note:''},{id:'b',type:'router',name:'核心路由器',x:410,y:185,ip:'192.168.1.1',note:''},{id:'c',type:'switch',name:'核心交換器',x:410,y:315,ip:'',note:''},{id:'d',type:'wifi',name:'Wi-Fi 基地台',x:170,y:465,ip:'',note:''},{id:'e',type:'pc',name:'辦公室電腦',x:410,y:465,ip:'',note:''},{id:'f',type:'server',name:'應用伺服器',x:650,y:465,ip:'',note:''}],edges:[{id:'1',a:'a',b:'b',label:''},{id:'2',a:'b',b:'c',label:''},{id:'3',a:'c',b:'d',label:''},{id:'4',a:'c',b:'e',label:''},{id:'5',a:'c',b:'f',label:''}]};try{state=JSON.parse(localStorage.getItem('netmap-v1'))||structuredClone(demo);if(!Array.isArray(state.nodes)||!Array.isArray(state.edges))throw 0}catch{state=structuredClone(demo)}
const iconPaths={

function iconSvg(type,attrs={}){let svg=el('svg',{viewBox:'0 0 48 48',fill:'none',stroke:'currentColor','stroke-width':'2.1','stroke-linecap':'round','stroke-linejoin':'round',...attrs});svg.innerHTML=iconPaths[type]||iconPaths.pc;return svg}
function el(tag,attrs={},text){let n=document.createElementNS(ns,tag);for(let [k,v] of Object.entries(attrs))n.setAttribute(k,v);if(text!=null)n.textContent=text;return n}function snapshot(){history.push(JSON.stringify(state));if(history.length>80)history.shift();future=[]}function save(){localStorage.setItem('netmap-v1',JSON.stringify(state));$('saved').textContent='● 已自動儲存'}function commit(){save();render()}function uid(){return Math.random().toString(36).slice(2,11)}function coord(e){let p=$('canvas').createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform($('view').getScreenCTM().inverse())}function setView(){$('view').setAttribute('transform',`translate(${pan.x} ${pan.y}) scale(${scale})`);$('zoom').textContent=Math.round(scale*100)+'%'}
Object.entries(icons).forEach(([type,[name,sym]])=>{let b=document.createElement('button');b.className='device';b.draggable=true;b.append(iconSvg(type));let label=document.createElement('span');label.textContent=name;b.append(label);b.onclick=()=>add(type,180+Math.random()*250,120+Math.random()*250);b.ondragstart=e=>e.dataTransfer.setData('text/plain',type);$('palette').append(b)});function add(type,x,y){snapshot();let n={id:uid(),type,name:icons[type][0],x,y,ip:'',note:''};state.nodes.push(n);multi.clear();selected={kind:'node',id:n.id};commit()}
$('canvas').ondragover=e=>e.preventDefault();$('canvas').ondrop=e=>{e.preventDefault();let t=e.dataTransfer.getData('text/plain'),p=coord(e);if(icons[t])add(t,p.x-65,p.y-37)};
const ports={nw:[0,0],n:[.5,0],ne:[1,0],e:[1,.5],se:[1,1],s:[.5,1],sw:[0,1],w:[0,.5]};
function size(n){return Number.isFinite(n.size)?Math.max(.6,Math.min(2.4,n.size)):1}
function portPoint(n,key){let [x,y]=ports[key]||ports.e,z=size(n);return {x:n.x+130*z*x,y:n.y+76*z*y}}
function nearestPort(n,p){return Object.keys(ports).reduce((best,key)=>{let a=portPoint(n,key),d=(a.x-p.x)**2+(a.y-p.y)**2;return !best||d<best.d?{key,d}:best},null)}
function edgePoints(edge){let a=state.nodes.find(n=>n.id===edge.a),b=state.nodes.find(n=>n.id===edge.b);if(!a||!b)return null;let ac={x:a.x+65*size(a),y:a.y+38*size(a)},bc={x:b.x+65*size(b),y:b.y+38*size(b)};let ap=ports[edge.ap]?edge.ap:nearestPort(a,bc).key,bp=ports[edge.bp]?edge.bp:nearestPort(b,ac).key;return {a:portPoint(a,ap),b:portPoint(b,bp),ap,bp}}
function portDirection(key){return key.includes('w')?{x:-1,y:0}:key.includes('e')?{x:1,y:0}:key==='n'?{x:0,y:-1}:{x:0,y:1}}
let guides=[],multi=new Set(),marquee=null,skipClick=false,draftPoint=null;let defaultLine={route:'straight',arrows:'none'};
function keyOf(kind,id){return kind+':'+id}function isSelected(kind,id){return multi.has(keyOf(kind,id))||selected?.kind===kind&&selected.id===id}
function selectItem(kind,id,add){let k=keyOf(kind,id);if(add){if(!multi.size&&selected)multi.add(keyOf(selected.kind,selected.id));if(multi.has(k))multi.delete(k);else multi.add(k);selected=null;if(multi.size===1){let [k]=multi;let i=k.indexOf(':');selected={kind:k.slice(0,i),id:k.slice(i+1)};multi.clear()}return false}if(multi.size&&multi.has(k))return true;multi.clear();selected={kind,id};return false}
function beginGroup(e){let pt=coord(e),keys=new Set(multi),nodes=state.nodes.filter(n=>keys.has(keyOf('node',n.id))),floors=state.floors.filter(f=>keys.has(keyOf('floor',f.id)));for(let f of floors)for(let n of state.nodes){let z=size(n);if(n.x+65*z>=f.x&&n.x+65*z<=f.x+f.w&&n.y+38*z>=f.y&&n.y+38*z<=f.y+f.h&&!nodes.includes(n))nodes.push(n)}let texts=state.texts.filter(t=>keys.has(keyOf('text',t.id))||floors.some(f=>t.x>=f.x&&t.x<=f.x+f.w&&t.y>=f.y&&t.y<=f.y+f.h)),ids=new Set(nodes.map(n=>n.id)),edges=state.edges.filter(x=>x.bend&&(keys.has(keyOf('edge',x.id))||ids.has(x.a)&&ids.has(x.b)));beginDrag(e,{kind:'group',px:pt.x,py:pt.y,items:[...nodes,...floors,...texts].map(o=>({o,x:o.x,y:o.y})),bends:edges.map(o=>({o,x:o.bend.x,y:o.bend.y}))})}

function choosePort(n,key){if(!start){start={id:n.id,port:key};selected={kind:'node',id:n.id};$('hint').textContent='選擇另一個設備的連接點'}else if(start.id!==n.id){snapshot();state.edges.push({id:uid(),a:start.id,ap:start.port,b:n.id,bp:key,label:'',route:defaultLine.route,arrows:defaultLine.arrows});selected=null;setMode('select');commit()}render()}

$('addFloor').onclick=()=>{normalize();snapshot();let p=centerCanvas(),f={id:uid(),x:Math.round(p.x-180),y:Math.round(p.y-110),w:360,h:220,title:'樓層區塊',color:'#eaf2ff',fontSize:16};state.floors.push(f);multi.clear();selected={kind:'floor',id:f.id};setMode('select');commit()};
