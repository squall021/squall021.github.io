<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>IT 問題處理知識庫 V4</title>
<link rel="stylesheet" href="style.css">
<style>.gallery-item{position:relative;border:1px solid #e3e8f0;border-radius:10px;overflow:hidden;background:#f8fafc}.gallery-item img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;border:0!important;border-radius:0!important}.attachment-label{font-size:11px;color:#667085;padding:6px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:#fff}.attach-item .attachment-label{position:absolute;left:0;right:0;bottom:0;background:rgba(255,255,255,.92)}.cloud-mark{position:absolute;left:6px;top:6px;font-size:14px;background:rgba(255,255,255,.92);border-radius:7px;padding:2px 5px}.drive-state{padding:9px 11px;border:1px solid #d8e0eb;border-radius:10px;background:#f8fafc;font-size:12px;font-weight:700;color:#526077;margin-bottom:8px}</style>
</head><body><div class="app">
<header class="topbar"><div class="brand"><div class="logo">🧰</div><div>IT 問題處理知識庫</div></div><div class="top-actions"><button class="btn" id="btnExport">⬇️ <span class="txt">匯出備份</span></button><button class="btn" id="btnImport">⬆️ <span class="txt">匯入備份</span></button><button class="btn" id="btnSync">☁️ <span class="txt">雲端連線</span></button><button class="btn" id="btnCategories">⚙️ <span class="txt">分類管理</span></button><button class="btn primary" id="btnAdd">＋ 新增紀錄</button></div></header>
<main><section class="hero"><div class="panel search-panel"><div class="searchbox"><span class="sicon">🔎</span><input id="searchInput" placeholder="搜尋標題、問題描述、錯誤訊息、原因、解決方式、標籤…"></div><div class="filters"><select id="categoryFilter"><option value="">全部分類</option></select><select id="favoriteFilter"><option value="">全部紀錄</option><option value="1">⭐ 只看收藏</option></select><input id="dateFrom" type="date"><input id="dateTo" type="date"></div></div><div class="panel stat-panel"><div class="stat"><b id="statTotal">0</b><span>總紀錄</span></div><div class="stat"><b id="statFavorite">0</b><span>收藏</span></div><div class="stat"><b id="statCategories">0</b><span>問題分類</span></div><div class="stat"><b id="statMonth">0</b><span>本月新增</span></div></div></section>
<div class="toolbar"><div class="count" id="resultCount">0 筆紀錄</div><div class="muted">Google 試算表雲端資料 + 本機離線快取</div><span class="sync-pill" id="syncStatus">☁️ 尚未設定雲端</span><div class="spacer"></div><div class="view-toggle"><button id="viewCards" class="active">▦</button><button id="viewList">☷</button></div><button class="btn" id="btnClearFilters">清除篩選</button></div><section class="records" id="records"></section></main></div>
<div class="modal" id="editModal"><div class="dialog"><div class="dialog-head"><h2 id="editTitle">新增問題紀錄</h2><div class="spacer"></div><button class="btn icon" data-close="editModal">✕</button></div><form id="recordForm"><div class="dialog-body"><div class="form-grid">
<div class="field"><label>問題類型 <span class="required">*</span></label><select id="fCategory" required></select></div><div class="field"><label>處理日期 <span class="required">*</span></label><input id="fDate" type="date" required></div>
<div class="field full"><label>問題標題 <span class="required">*</span></label><input id="fTitle" required placeholder="例如：Excel 無法複製貼上"></div><div class="field full"><label>問題描述 <span class="required">*</span></label><textarea id="fDescription" required></textarea></div>
<div class="field"><label>錯誤訊息 / 症狀</label><textarea id="fSymptom"></textarea></div><div class="field"><label>發生環境</label><textarea id="fEnvironment"></textarea></div><div class="field full"><label>原因</label><textarea id="fCause"></textarea></div><div class="field full"><label>解決方式 <span class="required">*</span></label><textarea id="fSolution" required></textarea></div>
<div class="field full"><label>參考網址</label><textarea id="fLinks" placeholder="每行一筆網址"></textarea></div><div class="field"><label>關鍵字 / 標籤</label><input id="fTags" placeholder="Excel, Office, 更新Bug"></div><div class="field"><label>收藏</label><select id="fFavorite"><option value="0">一般紀錄</option><option value="1">⭐ 加入收藏</option></select></div><div class="field full"><label>備註</label><textarea id="fNotes"></textarea></div>
<div class="field full"><label>附件 / 截圖</label><div class="attach-zone"><input id="fFiles" type="file" accept="image/*" multiple><div class="help">最多 5 張、單張 2 MB。圖片保存於 Google Drive。</div><div class="attach-grid" id="attachPreview"></div></div></div>
</div></div><div class="dialog-foot"><button type="button" class="btn" data-close="editModal">取消</button><button type="submit" class="btn primary">儲存紀錄</button></div></form></div></div>
<div class="modal" id="detailModal"><div class="dialog"><div class="dialog-head"><h2>問題紀錄</h2><div class="spacer"></div><button class="btn icon" data-close="detailModal">✕</button></div><div class="dialog-body" id="detailBody"></div><div class="dialog-foot"><button class="btn danger" id="detailDelete">刪除</button><button class="btn" id="detailEdit">編輯</button><button class="btn primary" data-close="detailModal">關閉</button></div></div></div>
<div class="modal" id="categoryModal"><div class="dialog small"><div class="dialog-head"><h2>分類管理</h2><div class="spacer"></div><button class="btn icon" data-close="categoryModal">✕</button></div><div class="dialog-body"><div class="category-row"><input id="newCategoryIcon" class="icon-input" value="📌" maxlength="4"><input id="newCategory" placeholder="新增分類名稱"><button class="btn primary" id="addCategory">新增</button></div><div class="help">正在使用中的分類不允許刪除。</div><div class="category-list" id="categoryList"></div></div></div></div>
<div class="modal" id="syncModal"><div class="dialog small"><div class="dialog-head"><h2>Google 雲端資料連線</h2><div class="spacer"></div><button class="btn icon" data-close="syncModal">✕</button></div><div class="dialog-body"><div class="form-grid"><div class="field full"><label>Apps Script Web App 網址</label><input id="syncUrl" placeholder="https://script.google.com/macros/s/.../exec"></div><div class="field full"><label>同步金鑰</label><input id="syncKey" type="password" autocomplete="off"></div><div class="field full" style="display:none"><label><input id="syncAuto" type="checkbox" checked> 自動同步</label></div><div class="field full"><div class="drive-state" id="syncDriveState">尚未檢查 Google 雲端連線</div><div class="sync-help">V4 採用 <b>Google 試算表為主要資料庫</b>、Google Drive 保存圖片附件。第一次設定完成後，之後開啟網頁會自動顯示最新雲端紀錄，不需要手動下載。</div></div></div></div><div class="dialog-foot"><button class="btn" id="btnPullCloud" style="display:none">從雲端下載</button><button class="btn" id="btnPushCloud" style="display:none">上傳全部資料</button><button class="btn" data-close="syncModal">取消</button><button class="btn primary" id="btnSaveSync">連線並載入</button></div></div></div>
<input class="hidden" id="importFile" type="file" accept=".json,application/json"><div class="toast" id="toast"></div><script src="app.js?v=4"></script><script src="cloud-mode.js?v=4"></script></body></html>
