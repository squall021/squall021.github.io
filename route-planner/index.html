<style>

<body>
<div class="app">
<header class="top"><div class="brand">↗ 路徑規劃工具</div><div class="actions"><button id="save">儲存</button><button id="load">讀取</button><button id="import">匯入 JSON</button><div class="export"><button id="exbtn">匯出 ▾</button><div id="menu" class="menu"><button data-ex="json">專案 JSON</button><button data-ex="gpx">GPX</button><button data-ex="kml">KML</button><button data-ex="csv">CSV</button><button data-ex="print">列印 / PDF</button></div></div><button id="clear">全部清除</button></div></header>
<main class="layout"><aside class="side">

<section class="sec"><h2>目的地 <span id="count" class="hint" style="float:right;margin:0">0 個</span></h2><div class="grid2"><button id="destmode" class="btn">＋ 地圖點選目的地</button><button id="loc" class="btn">目前位置</button></div><div id="destlist" class="destlist"></div></section>
<section class="sec"><h2>指定路線定位點</h2><select id="leg" class="select"></select><div class="grid2" style="margin-top:7px"><button id="viamode" class="btn warn">＋ 地圖插入定位點</button><button id="clearvia" class="btn">清除此段</button></div><div class="hint">橘色定位點不占用目的地編號，可加入多個並直接拖曳微調。</div><div id="vialist" class="vialist"></div></section>
<section class="sec"><h2>路線</h2><button id="route" class="btn primary" style="width:100%">重新規劃路線</button><div class="hint">地圖：OpenStreetMap　路線：OSRM　搜尋：Nominatim。均不需 Google API Key。</div></section>
</aside><section class="mapwrap"><div id="map"></div><div id="mode" class="mode"></div><div class="summary"><div class="sumrow"><div><strong id="dist">—</strong><div class="hint">總距離</div></div><div><strong id="time">—</strong><div class="hint">預估時間</div></div></div><div id="status" class="status">加入至少 2 個目的地後即可規劃。</div></div></section></main>
</div><input id="file" type="file" accept=".json,application/json" hidden><div id="toast" class="toast"></div>
<script>
(()=>{'use strict';

map.on('click',e=>{if(S.mode==='destination')addDest({lat:e.latlng.lat,lng:e.latlng.lng,name:`地圖定位 ${S.d.length+1}`});else if(S.mode==='via')addVia({lat:e.latlng.lat,lng:e.latlng.lng,name:'路線定位點'})});E.search.onclick=search;E.q.onkeydown=e=>{if(e.key==='Enter')search()};E.results.onclick=e=>{const b=e.target.closest('[data-r]');if(!b)return;const x=E.results._r?.[+b.dataset.i];if(!x)return;const p={lat:+x.lat,lng:+x.lon,name:x.name,displayName:x.display_name};if(b.dataset.r==='d')addDest(p);else if(b.dataset.r==='v')addVia({...p,name:'搜尋定位點'});else map.setView([p.lat,p.lng],17)};E.destlist.onclick=e=>{const b=e.target.closest('[data-a]');if(!b)return;const i=+b.dataset.i;b.dataset.a==='del'?delDest(i):moveDest(i,b.dataset.a==='up'?-1:1)};E.vialist.onclick=e=>{const b=e.target.closest('[data-va]');if(!b)return;const i=+b.dataset.i;b.dataset.va==='del'?delVia(S.leg,i):moveVia(S.leg,i,b.dataset.va==='up'?-1:1)};E.leg.onchange=()=>{S.leg=+E.leg.value||0;renderVia();if(S.mode==='via')setMode('via')};E.destmode.onclick=()=>setMode(S.mode==='destination'?null:'destination');E.viamode.onclick=()=>S.d.length<2?toast('請先加入至少 2 個目的地。'):setMode(S.mode==='via'?null:'via');E.clearvia.onclick=()=>{if(S.v[S.leg])S.v[S.leg]=[];render();route()};E.route.onclick=route;E.loc.onclick=()=>{if(!navigator.geolocation)return toast('此瀏覽器不支援定位。');navigator.geolocation.getCurrentPosition(p=>addDest({lat:p.coords.latitude,lng:p.coords.longitude,name:'目前位置'}),e=>toast(`無法取得目前位置：${e.message}`),{enableHighAccuracy:true,timeout:12000,maximumAge:30000})};
function data(){return{app:'RoutePlannerNoGoogle',version:'1.1',savedAt:new Date().toISOString(),destinations:S.d,viasByLeg:S.v,route:{distance:S.distance,duration:S.duration}}}function restore(j){if(!j||!Array.isArray(j.destinations))throw Error('檔案格式不正確');S.d=j.destinations.map(x=>point(x)).filter(x=>valid(x.lat,x.lng));const v=Array.isArray(j.viasByLeg)?j.viasByLeg:[];S.v=Array.from({length:Math.max(0,S.d.length-1)},(_,i)=>Array.isArray(v[i])?v[i].map(x=>point(x,'via')).filter(x=>valid(x.lat,x.lng)):[]);S.leg=0;setMode(null);render();fit();route()}E.save.onclick=()=>{localStorage.setItem(STORE,JSON.stringify(data()));toast('已儲存到這台瀏覽器。')};E.load.onclick=()=>{const x=localStorage.getItem(STORE);if(!x)return toast('尚無已儲存的規劃。');try{restore(JSON.parse(x));toast('已讀取。')}catch(e){toast(e.message)}};E.import.onclick=()=>E.file.click();E.file.onchange=async()=>{const f=E.file.files?.[0];if(!f)return;try{restore(JSON.parse(await f.text()));toast('匯入完成。')}catch(e){toast(`匯入失敗：${e.message}`)}E.file.value=''};
function dl(n,c,t='text/plain;charset=utf-8'){const b=new Blob([c],{type:t}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=n;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(u)}function stamp(){const d=new Date(),z=n=>String(n).padStart(2,'0');return `${d.getFullYear()}${z(d.getMonth()+1)}${z(d.getDate())}_${z(d.getHours())}${z(d.getMinutes())}`}function xml(s){return esc(s).replaceAll('&#39;','&apos;')}function line(){return S.geo?.coordinates||ordered().map(p=>[p.lng,p.lat])}function ex(type){if(type==='print')return print();if(type==='json')return dl(`route_${stamp()}.json`,JSON.stringify(data(),null,2),'application/json;charset=utf-8');if(!S.d.length)return toast('沒有可匯出的地點。');if(type==='csv'){const rows=[['類型','編號/路段','名稱','緯度','經度']];S.d.forEach((d,i)=>{rows.push(['目的地',i+1,d.name,d.lat,d.lng]);if(i<S.d.length-1)(S.v[i]||[]).forEach((v,j)=>rows.push(['定位點',`${i+1}-${j+1}`,v.name,v.lat,v.lng]))});const q=x=>`"${String(x).replaceAll('"','""')}"`;return dl(`route_${stamp()}.csv`,'\ufeff'+rows.map(r=>r.map(q).join(',')).join('\r\n'),'text/csv;charset=utf-8')}if(type==='gpx'){const w=[];S.d.forEach((d,i)=>{w.push(`<wpt lat="${d.lat}" lon="${d.lng}"><name>${xml(`${i+1}. ${d.name}`)}</name><type>destination</type></wpt>`);if(i<S.d.length-1)(S.v[i]||[]).forEach((v,j)=>w.push(`<wpt lat="${v.lat}" lon="${v.lng}"><name>${xml(`定位點 ${i+1}-${j+1}`)}</name><type>via</type></wpt>`))});const tr=line().map(c=>`<trkpt lat="${c[1]}" lon="${c[0]}"></trkpt>`).join('');return dl(`route_${stamp()}.gpx`,`<?xml version="1.0" encoding="UTF-8"?><gpx version="1.1" creator="RoutePlannerNoGoogle" xmlns="http://www.topografix.com/GPX/1/1">${w.join('')}<trk><name>規劃路線</name><trkseg>${tr}</trkseg></trk></gpx>`,'application/gpx+xml;charset=utf-8')}if(type==='kml'){const p=[];S.d.forEach((d,i)=>{p.push(`<Placemark><name>${xml(`${i+1}. ${d.name}`)}</name><Point><coordinates>${d.lng},${d.lat},0</coordinates></Point></Placemark>`);if(i<S.d.length-1)(S.v[i]||[]).forEach((v,j)=>p.push(`<Placemark><name>${xml(`定位點 ${i+1}-${j+1}`)}</name><Point><coordinates>${v.lng},${v.lat},0</coordinates></Point></Placemark>`))});const c=line().map(x=>`${x[0]},${x[1]},0`).join(' ');return dl(`route_${stamp()}.kml`,`<?xml version="1.0" encoding="UTF-8"?><kml xmlns="http://www.opengis.net/kml/2.2"><Document>${p.join('')}<Placemark><name>規劃路線</name><LineString><tessellate>1</tessellate><coordinates>${c}</coordinates></LineString></Placemark></Document></kml>`,'application/vnd.google-earth.kml+xml;charset=utf-8')}}E.exbtn.onclick=e=>{e.stopPropagation();E.menu.classList.toggle('open')};document.onclick=()=>E.menu.classList.remove('open');E.menu.onclick=e=>{const b=e.target.closest('[data-ex]');if(b)ex(b.dataset.ex)};E.clear.onclick=()=>{if(S.d.length&&!confirm('確定清除所有目的地、定位點與路線？'))return;S.d=[];S.v=[];S.leg=0;setMode(null);if(S.line)map.removeLayer(S.line);S.line=null;S.geo=null;render();E.results.innerHTML='';E.dist.textContent=E.time.textContent='—';status('加入至少 2 個目的地後即可規劃。');map.setView([23.7,121],7)};render();
