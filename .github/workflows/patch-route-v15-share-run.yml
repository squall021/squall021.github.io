name: Run Route Planner V1.5 Sharing Patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-route-v15-share-run.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch route planner
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/patch_v15.py
          python /tmp/patch_v15.py
      - name: Commit patched page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add route-planner/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Update route planner to V1.5 with share links and QR"
          git push
