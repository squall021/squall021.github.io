name: Patch Route Planner V1.5 Sharing

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-route-v15-share.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add sharing links QR and readonly mode
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('route-planner/index.html')
          s = p.read_text(encoding='utf-8')

          def rep(old, new, label, count=1):
              global s
              if old not in s:
                  raise SystemExit(f'{label} target not found')
              s = s.replace(old, new, count)

          rep('<title>路徑規劃工具 V1.4</title>', '<title>路徑規劃工具 V1.5</title>', 'title')

          rep(
              '<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>',
              '<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>\n<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>',
              'qrcode library'
          )

          css_anchor = '@media(max-width:820px)'
          share_css = r'''.sharebox{display:grid;gap:7px}.share-actions{display:grid;grid-template-columns:1fr 1fr;gap:7px}.modalbg{position:fixed;inset:0;z-index:5000;background:#0f172a99;display:none;align-items:center;justify-content:center;padding:18px}.modalbg.on{display:flex}.sharemodal{width:min(560px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:16px;padding:16px;box-shadow:0 20px 70px #0006}.sharemodal h2{margin:0 0 12px;font-size:18px}.shareurl{width:100%;min-height:76px;resize:vertical;border:1px solid #cbd5e1;border-radius:9px;padding:9px;font:12px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace}.qrarea{display:grid;place-items:center;min-height:210px;margin:10px 0;background:#f8fafc;border:1px solid var(--line);border-radius:11px;padding:10px}.sharewarn{font-size:12px;color:#92400e;line-height:1.5}.readonlybar{position:absolute;z-index:750;top:14px;left:14px;max-width:min(520px,calc(100% - 28px));background:#fffffff4;border:1px solid var(--line);border-radius:13px;padding:11px 12px;box-shadow:0 8px 26px #0f172a20;display:none}.readonlybar strong{font-size:16px}.readonlybar .meta{font-size:11px;color:var(--muted);margin:4px 0 8px}.readonly .layout{grid-template-columns:1fr}.readonly .side,.readonly .actions{display:none!important}.readonly .readonlybar{display:block}.readonly .top{justify-content:flex-start}.readonly .mode{display:none!important}'''
          rep(css_anchor, share_css + css_anchor, 'share css')

          rep(
              '<button id="importcsv">匯入 CSV</button><div class="export">',
              '<button id="importcsv">匯入 CSV</button><button id="share">分享</button><div class="export">',
              'share toolbar button'
          )

          route_section = '<section class="sec"><h2>路線</h2><button id="route" class="btn primary" style="width:100%">重新規劃路線</button><div class="hint">地圖：OpenStreetMap　路線：OSRM　搜尋：Nominatim。均不需 Google API Key。<br>V1.4 總路線點上限：50（目的地＋定位點）。</div></section>'
          share_section = '<section class="sec"><h2>路線資訊 / 分享</h2><div class="sharebox"><input id="routeName" class="input" placeholder="路線名稱，例如：9/20 台南活動交通路線"><div class="share-actions"><button id="shareSide" class="btn primary">產生分享連結</button><button id="shareJson" class="btn">下載 JSON 備份</button></div><div class="hint">分享連結會把路線資料壓縮在網址 # 後方，不需要資料庫。對方開啟後預設為唯讀模式。</div></div></section>\n<section class="sec"><h2>路線</h2><button id="route" class="btn primary" style="width:100%">重新規劃路線</button><div class="hint">地圖：OpenStreetMap　路線：OSRM　搜尋：Nominatim。均不需 Google API Key。<br>V1.5 總路線點上限：50（目的地＋定位點）。</div></section>'
          rep(route_section, share_section, 'share sidebar section')

          rep(
              '</aside><section class="mapwrap"><div id="map"></div><div id="mode" class="mode"></div>',
              '</aside><section class="mapwrap"><div id="map"></div><div id="readonlybar" class="readonlybar"><strong id="readonlyTitle">分享路線</strong><div id="readonlyMeta" class="meta"></div><button id="copyEdit" class="btn primary">複製此路線並編輯</button></div><div id="mode" class="mode"></div>',
              'readonly bar'
          )

          rep(
              '</div><input id="file" type="file" accept=".json,application/json" hidden>',
              '''</div><div id="shareModal" class="modalbg"><div class="sharemodal"><h2>分享路線</h2><textarea id="shareUrl" class="shareurl" readonly></textarea><div style="display:flex;gap:7px;flex-wrap:wrap;margin-top:8px"><button id="copyShare" class="btn primary">複製分享連結</button><button id="closeShare" class="btn">關閉</button></div><div id="qrcode" class="qrarea"></div><div id="shareWarn" class="sharewarn"></div><div class="hint">網址資料只存在 # 後方，不會上傳到 GitHub Pages。路線點很多時網址可能較長，此時建議同時傳送 JSON 備份。</div></div></div><input id="file" type="file" accept=".json,application/json" hidden>''',
              'share modal'
          )

          old_e = "importcsv:$('importcsv'),csvfile:$('csvfile'),exbtn:$('exbtn'),menu:$('menu'),clear:$('clear'),toast:$('toast')"
          new_e = "importcsv:$('importcsv'),csvfile:$('csvfile'),share:$('share'),shareSide:$('shareSide'),shareJson:$('shareJson'),routeName:$('routeName'),shareModal:$('shareModal'),shareUrl:$('shareUrl'),copyShare:$('copyShare'),closeShare:$('closeShare'),qrcode:$('qrcode'),shareWarn:$('shareWarn'),readonlybar:$('readonlybar'),readonlyTitle:$('readonlyTitle'),readonlyMeta:$('readonlyMeta'),copyEdit:$('copyEdit'),exbtn:$('exbtn'),menu:$('menu'),clear:$('clear'),toast:$('toast')"
          rep(old_e, new_e, 'element map')

          rep(
              "const S={d:[],v:[],leg:0,mode:null,dm:[],vm:[],line:null,geo:null,distance:0,duration:0,lastSearch:0,cache:{}};",
              "const S={d:[],v:[],leg:0,mode:null,dm:[],vm:[],line:null,geo:null,distance:0,duration:0,lastSearch:0,cache:{},name:'',createdAt:new Date().toISOString(),readonly:false};",
              'state'
          )

          s = s.replace('{draggable:true,icon:nicon(i),title:d.name}', '{draggable:!S.readonly,icon:nicon(i),title:d.name}', 1)
          s = s.replace('{draggable:true,icon:vicon()}', '{draggable:!S.readonly,icon:vicon()}', 1)

          rep("V1.4 總路線點上限為 50 個（目的地 + 定位點）。", "V1.5 總路線點上限為 50 個（目的地 + 定位點）。", 'route limit text')
          rep("超過 V1.4 的 50 個上限。", "超過 V1.5 的 50 個上限。", 'csv limit text')
          rep("超過 V1.4 的 50 個上限。", "超過 V1.5 的 50 個上限。", 'json limit text')

          old_data = "function data(){return{app:'RoutePlannerNoGoogle',version:'1.4',savedAt:new Date().toISOString(),destinations:S.d,viasByLeg:S.v,route:{distance:S.distance,duration:S.duration}}}"
          new_data = "function data(){return{app:'RoutePlannerNoGoogle',version:'1.5',routeName:S.name||'',createdAt:S.createdAt,updatedAt:new Date().toISOString(),savedAt:new Date().toISOString(),destinations:S.d,viasByLeg:S.v,route:{distance:S.distance,duration:S.duration}}}"
          rep(old_data, new_data, 'project data')

          restore_tail = "S.leg=0;setMode(null);render();fit();route()}E.save.onclick="
          restore_new = "S.name=String(j.routeName||j.name||'');S.createdAt=j.createdAt||j.savedAt||new Date().toISOString();E.routeName.value=S.name;S.leg=0;setMode(null);render();fit();route()}E.save.onclick="
          rep(restore_tail, restore_new, 'restore metadata')

          rep(
              "E.route.onclick=route;E.loc.onclick=()=>",
              "E.route.onclick=route;E.routeName.oninput=()=>{S.name=E.routeName.value.trim()};E.loc.onclick=()=>",
              'route name handler'
          )

          share_js = r'''
async function bytesToShare(bytes){let x='';for(let i=0;i<bytes.length;i+=32768)x+=String.fromCharCode(...bytes.subarray(i,i+32768));return btoa(x).replaceAll('+','-').replaceAll('/','_').replace(/=+$/,'')}function shareToBytes(s){s=s.replaceAll('-','+').replaceAll('_','/');while(s.length%4)s+='=';const x=atob(s),a=new Uint8Array(x.length);for(let i=0;i<x.length;i++)a[i]=x.charCodeAt(i);return a}async function packShare(o){const raw=new TextEncoder().encode(JSON.stringify(o));if('CompressionStream'in window){const cs=new CompressionStream('gzip'),w=cs.writable.getWriter();await w.write(raw);await w.close();return'g.'+await bytesToShare(new Uint8Array(await new Response(cs.readable).arrayBuffer()))}return'r.'+await bytesToShare(raw)}async function unpackShare(t){const dot=t.indexOf('.'),kind=dot>0?t.slice(0,dot):'r',body=dot>0?t.slice(dot+1):t,bytes=shareToBytes(body);let raw=bytes;if(kind==='g'){if(!('DecompressionStream'in window))throw Error('此瀏覽器不支援壓縮分享網址，請改用 JSON 匯入。');const ds=new DecompressionStream('gzip'),w=ds.writable.getWriter();await w.write(bytes);await w.close();raw=new Uint8Array(await new Response(ds.readable).arrayBuffer())}return JSON.parse(new TextDecoder().decode(raw))}function sharePayload(){S.name=E.routeName.value.trim();return{v:1,n:S.name,c:S.createdAt,u:new Date().toISOString(),d:S.d.map(x=>[x.name,+x.lat.toFixed(6),+x.lng.toFixed(6)]),w:S.v.map(a=>(a||[]).map(x=>[x.name,+x.lat.toFixed(6),+x.lng.toFixed(6)]))}}function payloadProject(p){return{routeName:p.n||'',createdAt:p.c||new Date().toISOString(),destinations:(p.d||[]).map(x=>({name:x[0],lat:+x[1],lng:+x[2]})),viasByLeg:(p.w||[]).map(a=>(a||[]).map(x=>({name:x[0],lat:+x[1],lng:+x[2]})))}}function fmtDate(x){if(!x)return'';try{return new Date(x).toLocaleString('zh-TW',{hour12:false})}catch{return x}}async function showShare(){if(!S.d.length)return toast('請先加入至少 1 個目的地。');try{const payload=sharePayload(),token=await packShare(payload),url=location.origin+location.pathname+'#share='+token;E.shareUrl.value=url;E.qrcode.innerHTML='';if(url.length<=2200&&typeof QRCode!=='undefined'){new QRCode(E.qrcode,{text:url,width:190,height:190,correctLevel:QRCode.CorrectLevel.M});E.shareWarn.textContent=`分享網址長度 ${url.length} 字元，可使用 QR Code。`}else{E.qrcode.innerHTML='<div class="hint" style="text-align:center">此路線分享網址較長，不產生 QR Code。<br>請使用「複製分享連結」或 JSON 備份。</div>';E.shareWarn.textContent=`分享網址長度 ${url.length} 字元。路線點較多時，建議同時傳送 JSON 備份。`}E.shareModal.classList.add('on')}catch(e){toast(`產生分享連結失敗：${e.message}`)}}async function copyShare(){const x=E.shareUrl.value;if(!x)return;try{await navigator.clipboard.writeText(x);toast('分享連結已複製。')}catch{E.shareUrl.focus();E.shareUrl.select();document.execCommand('copy');toast('分享連結已複製。')}}async function initSharedRoute(){if(!location.hash.startsWith('#share='))return;try{const p=await unpackShare(location.hash.slice(7));S.readonly=true;restore(payloadProject(p));document.body.classList.add('readonly');E.readonlyTitle.textContent=p.n||'分享路線';E.readonlyMeta.textContent=`建立：${fmtDate(p.c)}${p.u?'　分享：'+fmtDate(p.u):''}`;setMode(null);render();fit();route()}catch(e){toast(`分享路線讀取失敗：${e.message}`)}}E.share.onclick=showShare;E.shareSide.onclick=showShare;E.shareJson.onclick=()=>ex('json');E.copyShare.onclick=copyShare;E.closeShare.onclick=()=>E.shareModal.classList.remove('on');E.shareModal.onclick=e=>{if(e.target===E.shareModal)E.shareModal.classList.remove('on')};E.copyEdit.onclick=()=>{S.readonly=false;document.body.classList.remove('readonly');history.replaceState(null,'',location.pathname+location.search);render();fit();toast('已建立可編輯副本；之後的修改只存在你目前的瀏覽器。')};
'''
          rep('function dl(n,c,t=', share_js + 'function dl(n,c,t=', 'share javascript')

          s = s.replace('<trk><name>規劃路線</name>', '<trk><name>${xml(S.name||\'規劃路線\')}</name>', 1)
          s = s.replace('<Placemark><name>規劃路線</name><LineString>', '<Placemark><name>${xml(S.name||\'規劃路線\')}</name><LineString>', 1)

          rep('E.clear.onclick=()=>{', "E.routeName.value=S.name;E.clear.onclick=()=>{", 'initial route name')
          rep("S.d=[];S.v=[];S.leg=0;setMode(null);", "S.d=[];S.v=[];S.leg=0;S.name='';S.createdAt=new Date().toISOString();E.routeName.value='';setMode(null);", 'clear metadata')
          rep('render();\n})();', 'render();initSharedRoute();\n})();', 'share init')

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit patched page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add route-planner/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Update route planner to V1.5 with share links and QR"
          git push
