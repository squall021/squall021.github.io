name: Patch Route Planner V1.5.2 Share Permission

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-route-v152-share-permission.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply V1.5.2 share permission patch
        shell: bash
        run: |
          cat > /tmp/patch_v152.py <<'PY'
          from pathlib import Path

          p = Path("route-planner/index.html")
          s = p.read_text(encoding="utf-8")

          def rep(old, new, label):
              global s
              if old not in s:
                  raise SystemExit(f"{label} target not found")
              s = s.replace(old, new, 1)

          rep("<title>路徑規劃工具 V1.5.1</title>",
              "<title>路徑規劃工具 V1.5.2</title>",
              "title")

          rep(
              ".sharewarn{font-size:12px;color:#92400e;line-height:1.5}",
              ".sharewarn{font-size:12px;color:#92400e;line-height:1.5}.share-permission{display:flex;align-items:flex-start;gap:8px;border:1px solid var(--line);border-radius:10px;padding:10px;background:#f8fafc;font-size:13px;font-weight:700}.share-permission input{margin-top:2px;width:17px;height:17px;flex:0 0 auto}.share-permission-note{font-size:11px;color:var(--muted);line-height:1.5;margin:5px 0 9px}",
              "share permission css"
          )

          rep(
              "分享連結會把路線資料壓縮在網址 # 後方，不需要資料庫；對方開啟後預設為唯讀模式。",
              "分享連結預設為唯讀；需要讓對方修改時，可在分享視窗勾選「允許編輯」。",
              "sidebar share hint"
          )

          rep(
              "V1.5.1 總路線點上限：50（目的地＋定位點）。",
              "V1.5.2 總路線點上限：50（目的地＋定位點）。",
              "route version"
          )

          rep(
              '<div id="readonlybar" class="readonlybar"><strong id="readonlyTitle">分享路線</strong><div id="readonlyMeta" class="meta"></div><button id="copyEdit" class="btn primary">複製此路線並編輯</button></div>',
              '<div id="readonlybar" class="readonlybar"><strong id="readonlyTitle">分享路線</strong><div id="readonlyMeta" class="meta"></div></div>',
              "remove copy edit button"
          )

          rep(
              '<div id="shareModal" class="modalbg"><div class="sharemodal"><h2>分享路線</h2><textarea id="shareUrl" class="shareurl" readonly></textarea>',
              '<div id="shareModal" class="modalbg"><div class="sharemodal"><h2>分享路線</h2><label class="share-permission"><input id="shareEditable" type="checkbox"><span>允許收到此連結的人編輯路線</span></label><div class="share-permission-note">預設不勾選＝唯讀分享。勾選後，持有該分享連結的人可直接修改路線；修改不會回寫你的原始路線。</div><textarea id="shareUrl" class="shareurl" readonly></textarea>',
              "share modal permission option"
          )

          rep(
              "shareWarn:$('shareWarn'),readonlyTitle:$('readonlyTitle'),readonlyMeta:$('readonlyMeta'),copyEdit:$('copyEdit'),exbtn:$('exbtn')",
              "shareWarn:$('shareWarn'),shareEditable:$('shareEditable'),readonlyTitle:$('readonlyTitle'),readonlyMeta:$('readonlyMeta'),exbtn:$('exbtn')",
              "element map"
          )

          rep(
              "function data(){return{app:'RoutePlannerNoGoogle',version:'1.5.1',",
              "function data(){return{app:'RoutePlannerNoGoogle',version:'1.5.2',",
              "data version"
          )

          rep(
              "function sharePayload(){S.name=E.routeName.value.trim();return{v:1,n:S.name,c:S.createdAt,u:new Date().toISOString(),d:",
              "function sharePayload(){S.name=E.routeName.value.trim();return{v:2,e:E.shareEditable.checked?1:0,n:S.name,c:S.createdAt,u:new Date().toISOString(),d:",
              "share payload permission"
          )

          old_init = """async function initSharedRoute(){if(!location.hash.startsWith('#share='))return;try{const p=await unpackShare(location.hash.slice(7));S.readonly=true;restore(payloadProject(p));document.body.classList.add('readonly');E.readonlyTitle.textContent=p.n||'分享路線';E.readonlyMeta.textContent=`建立：${fmtDate(p.c)}${p.u?'　分享：'+fmtDate(p.u):''}`;setMode(null);render();fit();route();setTimeout(()=>map.invalidateSize(),0)}catch(e){console.error(e);S.readonly=false;document.body.classList.remove('readonly');toast(`分享路線讀取失敗：${e.message}`)}}"""
          new_init = """async function initSharedRoute(){if(!location.hash.startsWith('#share='))return;try{const p=await unpackShare(location.hash.slice(7)),editable=p.e===1;S.readonly=!editable;restore(payloadProject(p));document.body.classList.toggle('readonly',!editable);E.readonlyTitle.textContent=p.n||'分享路線';E.readonlyMeta.textContent=`建立：${fmtDate(p.c)}${p.u?'　分享：'+fmtDate(p.u):''}`;setMode(null);render();fit();route();setTimeout(()=>map.invalidateSize(),0);if(editable)toast('此分享連結已開放編輯；修改只存在目前瀏覽器，不會回寫原始路線。')}catch(e){console.error(e);S.readonly=false;document.body.classList.remove('readonly');toast(`分享路線讀取失敗：${e.message}`)}}"""
          rep(old_init, new_init, "shared route permission")

          old_handlers = """E.share.onclick=showShare;E.shareSide.onclick=showShare;E.shareJson.onclick=()=>ex('json');E.copyShare.onclick=copyShare;E.closeShare.onclick=()=>E.shareModal.classList.remove('on');E.shareModal.onclick=e=>{if(e.target===E.shareModal)E.shareModal.classList.remove('on')};E.copyEdit.onclick=()=>{S.readonly=false;document.body.classList.remove('readonly');history.replaceState(null,'',location.pathname+location.search);render();fit();setTimeout(()=>map.invalidateSize(),0);toast('已建立可編輯副本；之後的修改只存在目前瀏覽器。')};E.exbtn.onclick"""
          new_handlers = """E.share.onclick=showShare;E.shareSide.onclick=showShare;E.shareEditable.onchange=showShare;E.shareJson.onclick=()=>ex('json');E.copyShare.onclick=copyShare;E.closeShare.onclick=()=>E.shareModal.classList.remove('on');E.shareModal.onclick=e=>{if(e.target===E.shareModal)E.shareModal.classList.remove('on')};E.exbtn.onclick"""
          rep(old_handlers, new_handlers, "remove copy edit handler and add permission refresh")

          p.write_text(s, encoding="utf-8")
          PY
          python /tmp/patch_v152.py
      - name: Validate inline JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('route-planner/index.html').read_text(encoding='utf-8')
          start = s.rfind('<script>')
          end = s.find('</script>', start)
          if start < 0 or end < 0:
              raise SystemExit('inline script not found')
          Path('/tmp/route-planner.js').write_text(s[start+8:end], encoding='utf-8')
          PY
          node --check /tmp/route-planner.js
      - name: Commit V1.5.2
        shell: bash
        run: |
          git config user.name "squall021"
          git config user.email "squall021@users.noreply.github.com"
          git add route-planner/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Update route planner to V1.5.2 share permissions"
          git push
