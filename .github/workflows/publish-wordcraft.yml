name: Publish WordCraft Web

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-wordcraft.yml'

permissions:
  contents: write

concurrency:
  group: wordcraft-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Download pinned official release
        shell: bash
        run: |
          set -euo pipefail
          VERSION=0.5.0
          BASE="https://github.com/storytold/wordcraft/releases/download/v${VERSION}"
          curl -fL --retry 3 "${BASE}/wordcraft-web-${VERSION}.zip" -o /tmp/wordcraft-web.zip
          curl -fL --retry 3 "${BASE}/SHA256SUMS.txt" -o /tmp/SHA256SUMS.txt
          ( cd /tmp && grep -F "wordcraft-web-${VERSION}.zip" SHA256SUMS.txt | sha256sum -c - )

      - name: Extract without changing other sites
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/wordcraft-extracted
          unzip -q /tmp/wordcraft-web.zip -d /tmp/wordcraft-extracted
          INDEX="$(find /tmp/wordcraft-extracted -type f -name index.html -print -quit)"
          test -n "$INDEX" || { echo "Missing index.html"; exit 1; }
          WEBROOT="$(dirname "$INDEX")"
          test -f "$WEBROOT/index.html"
          rm -rf wordcraft
          mkdir -p wordcraft
          cp -a "$WEBROOT"/. wordcraft/
          touch .nojekyll
          test -f wordcraft/index.html

      - name: Save deployment in Git history
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A wordcraft .nojekyll
          if git diff --cached --quiet; then
            echo "No WordCraft changes"
            exit 0
          fi
          git commit -m "Deploy WordCraft Web v0.5.0"
          git push
