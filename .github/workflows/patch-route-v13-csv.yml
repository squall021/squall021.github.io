name: Patch Route Planner V1.3 CSV Import

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-route-v13-csv.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add CSV import
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('route-planner/index.html')
          s = p.read_text(encoding='utf-8')

          old = '<button id="import">匯入 JSON</button><div class="export">'
          new = '<button id="import">匯入 JSON</button><button id="importcsv">匯入 CSV</button><div class="export">'
          if old not in s:
              raise SystemExit('top import button target not found')
          s = s.replace(old, new, 1)

          old = '</div><input id="file" type="file" accept=".json,application/json" hidden><div id="toast" class="toast"></div>'
          new = '</div><input id="file" type="file" accept=".json,application/json" hidden><input id="csvfile" type="file" accept=".csv,text/csv" hidden><div id="toast" class="toast"></div>'
          if old not in s:
              raise SystemExit('hidden file input target not found')
          s = s.replace(old, new, 1)

          old = "import:$('import'),file:$('file'),exbtn:$('exbtn')"
          new = "import:$('import'),file:$('file'),importcsv:$('importcsv'),csvfile:$('csvfile'),exbtn:$('exbtn')"
          if old not in s:
              raise SystemExit('E object target not found')
          s = s.replace(old, new, 1)

          marker = "function data(){return{app:'RoutePlannerNoGoogle'"
          if marker not in s:
              raise SystemExit('data function target not found')

          csv_js = r'''function parseCSV(t){t=String(t||'').replace(/^\uFEFF/,'');const rows=[];let row=[],cell='',quoted=false;for(let i=0;i<t.length;i++){const ch=t[i];if(quoted){if(ch==='"'&&t[i+1]==='"'){cell+='"';i++}else if(ch==='"')quoted=false;else cell+=ch}else{if(ch==='"')quoted=true;else if(ch===','){row.push(cell);cell=''}else if(ch==='\n'){row.push(cell);if(row.some(x=>String(x).trim()!==''))rows.push(row);row=[];cell=''}else if(ch!=='\r')cell+=ch}}row.push(cell);if(row.some(x=>String(x).trim()!==''))rows.push(row);return rows}function importCSVText(t){const rows=parseCSV(t);if(rows.length<2)throw Error('CSV 沒有可匯入的資料。');const h=rows[0].map(x=>String(x||'').trim().toLowerCase().replace(/\s+/g,'')),find=a=>h.findIndex(x=>a.includes(x)),iName=find(['名稱','地點名稱','name']),iLat=find(['緯度','lat','latitude']),iLng=find(['經度','lng','lon','longitude']),iType=find(['類型','type']),iOrder=find(['編號/路段','編號','路段','order','leg']);if(iLat<0||iLng<0)throw Error('CSV 必須包含「緯度」與「經度」欄位。');const ds=[],vs=[];for(let r=1;r<rows.length;r++){const a=rows[r];if(!a.some(x=>String(x).trim()!==''))continue;const lat=Number(String(a[iLat]??'').trim()),lng=Number(String(a[iLng]??'').trim());if(!valid(lat,lng))throw Error(`第 ${r+1} 列經緯度無效。`);const type=String(iType>=0?a[iType]??'':'目的地').trim().toLowerCase(),name=String(iName>=0?a[iName]??'':'').trim()||`目的地 ${ds.length+1}`,ord=String(iOrder>=0?a[iOrder]??'':'').trim();if(type.includes('定位')||type==='via'||type==='waypoint'){const m=ord.match(/^(\d+)/);if(!m)throw Error(`第 ${r+1} 列定位點缺少有效的路段編號，例如 1-1。`);vs.push({leg:+m[1]-1,seq:(ord.match(/-(\d+)/)||[])[1]?+RegExp.$1:vs.length+1,p:point({name,lat,lng},'via')})}else{const n=Number.parseInt(ord,10);ds.push({order:Number.isFinite(n)?n:ds.length+1,p:point({name,lat,lng})})}}if(!ds.length)throw Error('CSV 中沒有目的地資料。');ds.sort((a,b)=>a.order-b.order);S.d=ds.map(x=>x.p);S.v=Array.from({length:Math.max(0,S.d.length-1)},()=>[]);vs.sort((a,b)=>a.leg-b.leg||a.seq-b.seq).forEach(x=>{if(x.leg<0||x.leg>=S.v.length)throw Error(`定位點指定的路段 ${x.leg+1} 不存在。`);S.v[x.leg].push(x.p)});S.leg=0;setMode(null);render();fit();route();toast(`CSV 匯入完成：${S.d.length} 個目的地、${vs.length} 個定位點。`)}'''
          s = s.replace(marker, csv_js + marker, 1)

          old = "E.import.onclick=()=>E.file.click();E.file.onchange=async()=>{const f=E.file.files?.[0];if(!f)return;try{restore(JSON.parse(await f.text()));toast('匯入完成。')}catch(e){toast(`匯入失敗：${e.message}`)}E.file.value=''};"
          new = old + "E.importcsv.onclick=()=>E.csvfile.click();E.csvfile.onchange=async()=>{const f=E.csvfile.files?.[0];if(!f)return;try{if(S.d.length&&!confirm('匯入 CSV 會取代目前的目的地與定位點，是否繼續？'))return;importCSVText(await f.text())}catch(e){toast(`CSV 匯入失敗：${e.message}`)}finally{E.csvfile.value=''}};"
          if old not in s:
              raise SystemExit('JSON import handler target not found')
          s = s.replace(old, new, 1)

          s = s.replace('<title>路徑規劃工具 V1.2</title>', '<title>路徑規劃工具 V1.3</title>', 1)
          s = s.replace("version:'1.1'", "version:'1.3'", 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit patched page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add route-planner/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Update route planner to V1.3 with CSV import"
          git push
